<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEMORA 离线档案</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#111;--mut:#8a8f98;--line:#e8e9ec;--ok:#2f8f63;--warn:#9a7b4f;--bad:#be4a42}
@media (prefers-color-scheme:dark){:root{--bg:#0b0c0d;--card:#16181a;--ink:#f2f2f3;--mut:#8c9198;--line:#24272a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Noto Sans SC",system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:18px 18px 12px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 2px;font-size:20px;letter-spacing:.3px}
.sub{color:var(--mut);font-size:12px}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:9px 12px;font-size:13px}
input{flex:1;min-width:140px}
main{max-width:820px;margin:0 auto;padding:14px 14px 60px}
.item{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--line)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-bottom:6px}
.badge{padding:2px 7px;border-radius:6px;font-size:11px;border:1px solid var(--line)}
.b-ok{color:var(--ok);border-color:var(--ok)}
.b-warn{color:var(--warn);border-color:var(--warn)}
.b-bad{color:var(--bad);border-color:var(--bad)}
.body{white-space:pre-wrap;word-break:break-word}
.cs{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--mut)}
.cs div{margin:4px 0}
.cs b{color:var(--ink);font-weight:600}
details summary{cursor:pointer;font-size:12px;color:var(--mut);margin-top:8px}
.hint{color:var(--mut);font-size:12px;text-align:center;padding:26px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 6px;border-bottom:1px solid var(--line)}
</style></head><body>
<header>
  <h1>MEMORA 离线档案</h1>
  <div class="sub" id="sub"></div>
  <div class="tools">
    <input id="q" placeholder="搜索正文 内容 ID 位置">
    <select id="y"></select>
    <select id="s">
      <option value="">全部状态</option>
      <option value="CURRENT">当前可见</option>
      <option value="RECOVERED_FULL">完整恢复</option>
      <option value="RECOVERED_PARTIAL">部分恢复</option>
      <option value="INTERACTION_FRAGMENT">互动残留</option>
      <option value="LOCAL_COPY">本地副本</option>
    </select>
  </div>
</header>
<main>
  <div id="list"></div>
  <details><summary id="fsum">好友列表</summary><div id="friends"></div></details>
  <div class="hint">缺少字段只表示没有找到证据 不代表服务器已经删除</div>
</main>
<script>
const DATA = __DATA__;
const FRIENDS = __FRIENDS__;
const META = __META__;
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function fmt(t){if(!t)return '时间未知';return new Date(t).toLocaleString('zh-CN',{hour12:false});}
document.getElementById('sub').textContent = 'UIN ' + META.uin + ' · ' + DATA.length + ' 条内容 · ' + FRIENDS.length + ' 位好友 · 导出 ' + fmt(META.exportedAt);
document.getElementById('fsum').textContent = '好友列表 · ' + FRIENDS.length;
const years = [];
DATA.forEach(function(m){ if(m.time){ const y = new Date(m.time).getFullYear(); if(years.indexOf(y)<0) years.push(y); }});
years.sort(function(a,b){return b-a;});
const ysel = document.getElementById('y');
ysel.innerHTML = '<option value="">全部年份</option>' + years.map(function(y){return '<option>'+y+'</option>';}).join('');
function badgeClass(state){
  if(state==='CURRENT'||state==='RECOVERED_FULL'||state==='RECYCLE_BIN') return 'b-ok';
  if(state==='RECOVERED_PARTIAL'||state==='INFERRED') return 'b-warn';
  return 'b-bad';
}
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const y = ysel.value;
  const st = document.getElementById('s').value;
  const out = DATA.filter(function(m){
    if(st && m.state !== st) return false;
    if(y && (!m.time || String(new Date(m.time).getFullYear()) !== y)) return false;
    if(q && ((m.content||'')+' '+m.tid+' '+(m.location||'')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  const list = document.getElementById('list');
  if(!out.length){ list.innerHTML = '<div class="hint">没有符合条件的记录</div>'; return; }
  list.innerHTML = out.map(function(m){
    let h = '<div class="item">';
    h += '<div class="meta"><span class="badge '+badgeClass(m.state)+'">'+esc(m.stateLabel)+'</span>';
    h += '<span>'+fmt(m.time)+'</span><span>'+esc(m.completeness)+' · 可信度'+esc(m.confidence)+'</span>';
    if(m.comments) h += '<span>评论 '+m.comments+'</span>';
    if(m.activities) h += '<span>互动 '+m.activities+'</span>';
    h += '</div><div class="body">'+(esc(m.content) || '<span style="color:var(--mut)">正文未找到</span>')+'</div>';
    if(m.commentList && m.commentList.length){
      h += '<details><summary>评论 '+m.commentList.length+'</summary><div class="cs">';
      h += m.commentList.map(function(c){return '<div><b>'+esc(c.a)+'</b> '+esc(c.c)+'</div>';}).join('');
      h += '</div></details>';
    }
    const keys = Object.keys(m.fields||{});
    h += '<details><summary>来源与字段</summary><div class="cs">';
    h += keys.length ? keys.map(function(k){return '<div><b>'+esc(k)+'</b> ← '+esc(m.fields[k])+'</div>';}).join('') : '<div>没有字段来源</div>';
    h += '</div></details></div>';
    return h;
  }).join('');
}
function renderFriends(){
  document.getElementById('friends').innerHTML = '<table>' + FRIENDS.map(function(f){
    const badge = f.gone ? '<span class="badge b-warn">'+(f.gone>1?'已消失':'疑似消失')+'</span>' : '<span class="badge b-ok">在列</span>';
    return '<tr><td>'+esc(f.name)+'</td><td>'+esc(f.uin)+'</td><td>'+badge+'</td><td>首次 '+fmt(f.first)+'</td></tr>';
  }).join('') + '</table>';
}
document.getElementById('q').addEventListener('input', render);
ysel.addEventListener('change', render);
document.getElementById('s').addEventListener('change', render);
render(); renderFriends();
</script>
</body></html>
